[project]
name = "flight-lakehouse"
version = "0.1.0"
description = "Real-time lakehouse for live ADS-B aircraft positions: Kafka, Spark, Iceberg, Trino and dbt."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.5",
    "httpx>=0.27",
]

[project.scripts]
flight-lakehouse = "flight_lakehouse.cli:main"

[dependency-groups]
dev = [
    "pyiceberg[pyarrow]>=0.9",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs the Compose stack running (make up)",
]
