[project]
name = "flight-lakehouse"
version = "0.1.0"
description = "Real-time lakehouse for live ADS-B aircraft positions: Kafka, Spark, Iceberg, Trino and dbt."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.5",
    "httpx>=0.27",
]

[project.scripts]
flight-lakehouse = "flight_lakehouse.cli:main"

[dependency-groups]
dev = [
    "diff-cover>=11.0.1",
    "mypy>=2.4.1",
    "pyiceberg[pyarrow]>=0.9",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM",
    "S",    # bandit security checks
    "C90",  # complexity
    "PL",   # pylint
    "PT",   # pytest style
    "RET",  # return statements
    "ARG",  # unused arguments
]
ignore = [
    "PLC0415",  # the CLI imports heavy modules lazily on purpose
    "PLR0913",  # settings-driven entry points take many arguments
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts, literal expected values and fakes with unused
# arguments, and shell out to docker compose.
"tests/**" = ["S101", "S603", "S607", "PLR2004", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.coverage.run]
source = ["flight_lakehouse"]
branch = true

[tool.coverage.report]
# The Spark modules are only exercised by the Docker tests (make test-stream).
fail_under = 70
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs the Compose stack running (make up)",
    "spark: runs Spark jobs in Docker; slow (make test-stream)",
]
