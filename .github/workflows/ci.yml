name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff-cover compares against the base branch
      # PySpark 4 needs Java 17+; the Spark image uses 21. Without it the Spark tests skip.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - run: make test-dags
      - name: Require 80% coverage on changed lines
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: astral-sh/setup-uv@v6
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev > requirements.txt
          uvx pip-audit -r requirements.txt --disable-pip --require-hashes
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dockerfiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [infra/airflow/Dockerfile, infra/grafana/Dockerfile, infra/producer/Dockerfile, infra/spark/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  # Redeploys the stack on the home machine after every green push to main. The runner
  # there is registered with the `lakehouse` label. Never run pull_request jobs on it:
  # once the repo is public, a fork's PR could run any code on that machine.
  deploy:
    needs: [lint, test, security, dockerfiles]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lakehouse]
    concurrency:
      group: deploy
      cancel-in-progress: false # never stop a deploy halfway
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # keep the ignored .env and data/recordings/ between deploys
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Trino and the airports seed first: silver's flights need reference.airports.
      # The gold models aren't built here; Airflow builds them every 15 minutes once silver
      # has data, and runs the nightly Iceberg maintenance.
      - run: make trino dbt-seed stream airflow
