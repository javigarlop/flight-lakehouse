# Local stack: Kafka, Apicurio Registry, SeaweedFS (S3), Polaris (Iceberg REST catalog,
# with its state in Postgres so tables survive restarts), Trino, Grafana and Prometheus.
# Start with `make up` from the repo root; credentials come from .env.

name: flight-lakehouse

services:
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Keep 7 days of events (the plan's retention); Iceberg holds the longer-lived aggregates.
      KAFKA_LOG_RETENTION_HOURS: 168
      # Store data in the named volume (the image defaults to /tmp, lost on recreate).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  schema-registry:
    image: apicurio/apicurio-registry:3.3.4
    ports:
      - "127.0.0.1:${REGISTRY_HOST_PORT:-8081}:8080"
    environment:
      # Lets the registry UI (another origin) call the API from the browser.
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
      # Web UIs: filer (browse buckets and files) and master (cluster and volumes).
      - "127.0.0.1:${SEAWEEDFS_FILER_HOST_PORT:-8888}:8888"
      - "127.0.0.1:${SEAWEEDFS_MASTER_HOST_PORT:-9333}:9333"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "admin",
          "credentials": [{"accessKey": "$${S3_ACCESS_KEY}", "secretKey": "$${S3_SECRET_KEY}"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/data \
          -master.volumeSizeLimitMB=256 -volume.max=50 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8888/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.53
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Safe to re-run: an existing bucket counts as success.
      - |
        echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=seaweedfs:9333 2>&1 | tee /tmp/out
        grep -qE "created bucket|already exists" /tmp/out
    restart: "no"

  # Polaris keeps its catalog state (catalogs, namespaces, tables, principals) here.
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Creates Polaris's tables and the root principal on first start.
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    depends_on:
      postgres:
        condition: service_healthy
    environment: &polaris-db
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - bootstrap
      - --realm=POLARIS
      - --credential=POLARIS,${POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET}
    restart: "no"

  polaris:
    image: apache/polaris:1.8.0
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${POLARIS_HOST_PORT:-8181}:8181"
    environment:
      <<: *polaris-db
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      # Polaris's own credentials for the object store (used when it writes table metadata).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8182/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  polaris-init:
    image: curlimages/curl:8.22.0
    depends_on:
      polaris:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      POLARIS_CATALOG: ${POLARIS_CATALOG}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./polaris/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # SQL over the Iceberg tables, for dbt and Grafana: start with `make trino`.
  trino:
    image: trinodb/trino:484
    profiles: [query]
    depends_on:
      polaris:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TRINO_HOST_PORT:-8080}:8080"
    # The image sizes the JVM heap at 80% of this, so 1.5 GB gives about 1.2 GB of heap.
    mem_limit: 1536m
    environment:
      POLARIS_CATALOG: ${POLARIS_CATALOG}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    restart: unless-stopped

  # Live ingestion: polls adsb.lol every 4 minutes (360 of the 500 daily requests)
  # and publishes to Kafka. Raw responses are also saved to data/recordings/.
  producer:
    build:
      context: ../..
      dockerfile: infra/producer/Dockerfile
    image: flight-lakehouse-producer:dev
    profiles: [stream]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-240}
    volumes:
      - ../../data/recordings:/app/data/recordings
    command: ["produce", "--record", "data/recordings/live.jsonl"]
    restart: unless-stopped

  # Spark streaming jobs: start with `make stream`. Code is mounted, so edits need no rebuild.
  spark-bronze:
    build: ../spark
    image: flight-lakehouse-spark:dev
    profiles: [stream]
    ports:
      # Spark UI: jobs, micro-batch timings, input rate vs processing rate.
      - "127.0.0.1:${SPARK_UI_HOST_PORT:-4040}:4040"
    depends_on:
      kafka:
        condition: service_healthy
      polaris:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment: &spark-env
      KAFKA_BOOTSTRAP: kafka:9092
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_CATALOG: ${POLARIS_CATALOG}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CHECKPOINT_DIR: /checkpoints
      # Micro-batch interval of both jobs; `TRIGGER_SECONDS=5 make benchmark` measures
      # the jobs rather than the schedule.
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-30}
    volumes: &spark-volumes
      - ../../src:/app/src:ro
      - ../../schemas:/app/schemas:ro
      - spark-checkpoints:/checkpoints
    command:
      - /opt/spark/bin/spark-submit
      - --master=local[2]
      - --driver-memory=1g
      - --conf=spark.ui.showConsoleProgress=false
      - src/flight_lakehouse/streaming/bronze.py
    restart: unless-stopped

  spark-silver:
    image: flight-lakehouse-spark:dev
    profiles: [stream]
    ports:
      - "127.0.0.1:${SPARK_SILVER_UI_HOST_PORT:-4041}:4040"
    depends_on:
      spark-bronze:
        condition: service_started
    environment: *spark-env
    volumes: *spark-volumes
    command:
      - /opt/spark/bin/spark-submit
      - --master=local[2]
      - --driver-memory=1g
      - --conf=spark.ui.showConsoleProgress=false
      - src/flight_lakehouse/streaming/silver.py
    restart: unless-stopped

  # Orchestration: Airflow runs the dbt gold models every 15 minutes, a daily Iceberg
  # maintenance (Spark) and on-demand backfills. Start with `make airflow` (needs Trino).
  # One `airflow standalone` container (scheduler, API server, DAG processor) keeps it
  # small; its state lives in the stack's Postgres.
  airflow-db-init:
    image: postgres:17.11-alpine
    profiles: [orchestrate]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: polaris
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Safe to re-run, and works on a Postgres volume created before Airflow existed.
      - |
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1 \
          || psql -c "CREATE DATABASE airflow"
    restart: "no"

  airflow:
    build:
      context: ../airflow
      additional_contexts:
        spark: docker-image://flight-lakehouse-spark:dev
    image: flight-lakehouse-airflow:dev
    profiles: [orchestrate]
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
      polaris:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8090}:8080"
    # Airflow itself takes about 1 GB; the maintenance run adds a 1 GB Spark driver.
    mem_limit: 3g
    environment:
      <<: *spark-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Schedule the DAGs as soon as a deploy adds them, rather than waiting to be unpaused.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
      # No login: the UI is only bound to 127.0.0.1.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # dbt reads the mounted project read-only and writes its artefacts to /tmp.
      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      TRINO_HOST: trino
      TRINO_HOST_PORT: "8080"
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ../../dags:/opt/airflow/dags:ro
      - ../../dbt:/opt/airflow/dbt:ro
      - ../../src:/opt/airflow/src:ro
      - airflow-logs:/opt/airflow/logs
    command:
      - bash
      - -c
      # One write slot shared by every DAG: dbt's merges and maintenance's rewrites of the
      # same Iceberg tables would otherwise fail each other's commits.
      - |
        airflow db migrate \
          && airflow pools set iceberg_writes 1 "dbt and maintenance, one at a time" \
          && exec airflow standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # Dashboards on the gold tables, read through Trino: start with `make grafana`.
  grafana:
    build: ../grafana
    image: flight-lakehouse-grafana:dev
    profiles: [dashboard]
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    # About 300 MB idle; the rest is headroom for dashboard queries.
    mem_limit: 768m
    environment:
      # No login: the UI is only bound to 127.0.0.1.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Only the baked-in Trino plugin: no downloads of Grafana's default extra plugins.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Streaming metrics for Grafana's Streaming dashboard: started by `make grafana`.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [dashboard]
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    # A few dozen series: well under 100 MB.
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Covers the 7-day Kafka, bronze and silver retention, with a week more of trends.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Kafka topic offsets for Prometheus, so the dashboard shows what the producer publishes.
  # Spark doesn't commit offsets to a consumer group, so Spark's lag comes from the jobs'
  # own metrics instead (src/flight_lakehouse/streaming/metrics.py).
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    profiles: [dashboard]
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 64m
    command:
      - --kafka.server=kafka:9092
      # Its client defaults to an old protocol version, which Kafka 4 no longer speaks.
      - --kafka.version=3.9.0
      # Only the pipeline's topics, not the ones the integration tests create.
      - --topic.filter=^flight\..*
    restart: unless-stopped

  # Optional web UIs: start with `make up-ui`.

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [ui]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: flight-lakehouse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Apicurio's Confluent-compatible API, so the UI can decode Avro messages.
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8080/apis/ccompat/v7

  registry-ui:
    image: apicurio/apicurio-registry-ui:3.3.4
    profiles: [ui]
    depends_on:
      - schema-registry
    ports:
      - "127.0.0.1:${REGISTRY_UI_HOST_PORT:-8086}:8080"
    environment:
      # Called from the browser, so it uses the host port, not the service name.
      REGISTRY_API_URL: http://localhost:${REGISTRY_HOST_PORT:-8081}/apis/registry/v3

volumes:
  airflow-logs:
  grafana-data:
  kafka-data:
  postgres-data:
  prometheus-data:
  spark-checkpoints:
  seaweedfs-data:
